site_name: Reactive Documentation
site_url: https://orhpel.github.io/reactive/
repo_url: https://github.com/orhpel/reactive
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Reference:
      - Übersicht: Reference/index.md
      # Füge hier weitere Seiten aus docs/Reference/ hinzu
  # Weitere Ordner/Seiten nach demselben Muster

plugins:
  - search
