site_url: https://orhpel.github.io/reactive/
repo_url: https://github.com/orhpel/reactive
edit_uri: edit/main/docs/
site_name: Reactive Documentation
theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Reference:
      - Overview: Reference/index.md

plugins:
  - search
