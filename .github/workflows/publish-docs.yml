name: Publish docs
on:
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/publish-docs.yml
concurrency:
  group: publish-docs
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Andrew-Chen-Wang/github-wiki-action@v5
